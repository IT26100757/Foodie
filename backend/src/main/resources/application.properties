spring.application.name=backend
# Persistent local H2 file is the demo default. Set FOODIE_DB_URL, FOODIE_DB_USERNAME,
# and FOODIE_DB_PASSWORD to use the project MySQL/Aiven database.
spring.datasource.url=${FOODIE_DB_URL:jdbc:h2:file:./data/foodie-wallet;AUTO_SERVER=TRUE}
spring.datasource.username=${FOODIE_DB_USERNAME:sa}
spring.datasource.password=${FOODIE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
